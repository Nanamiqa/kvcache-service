apiVersion: v1
kind: ConfigMap
metadata:
  name: kvcache-gateway
data:
  KVCACHE_BACKEND: vllm
  KVCACHE_MODEL: Qwen/Qwen3-8B
  KVCACHE_MODEL_REVISION: REPLACE_WITH_IMMUTABLE_REVISION
  KVCACHE_MODEL_FINGERPRINT: REPLACE_WITH_RELEASE_OR_WEIGHT_HASH
  KVCACHE_VLLM_ENDPOINTS: http://vllm-0.vllm-headless:8000,http://vllm-1.vllm-headless:8000
  KVCACHE_CACHE_TTL_SECONDS: "86400"
  KVCACHE_REQUEST_TIMEOUT_SECONDS: "600"
  KVCACHE_ADMISSION_QUEUE_TIMEOUT_SECONDS: "5"
  KVCACHE_SHUTDOWN_GRACE_SECONDS: "45"
  KVCACHE_MAX_CONCURRENT_REQUESTS: "512"
  KVCACHE_MAX_CONCURRENT_PER_TENANT: "32"
  KVCACHE_METRICS_ENABLED: "true"
  KVCACHE_VLLM_MAX_RETRIES: "1"
  KVCACHE_VLLM_CIRCUIT_BREAKER_FAILURES: "3"
  KVCACHE_VLLM_CIRCUIT_BREAKER_COOLDOWN_SECONDS: "15"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvcache-gateway
  labels:
    app.kubernetes.io/name: kvcache-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: kvcache-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kvcache-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 60
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: REPLACE_ME/kvcache-service:0.3.0-gateway
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: kvcache-gateway
            - secretRef:
                name: kvcache-gateway-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: index
              mountPath: /data/kvcache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: index
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kvcache-gateway
  labels:
    app.kubernetes.io/name: kvcache-gateway
spec:
  selector:
    app.kubernetes.io/name: kvcache-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kvcache-gateway
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kvcache-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kvcache-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kvcache-gateway
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
